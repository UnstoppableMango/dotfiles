# erik's keys mirror the nixos repo's clan user `erik` (sops/users/erik/key.json).
# One software key per machine, decrypted unattended by sops-nix, plus each
# YubiKey's PIV slot as a backup (age-plugin-yubikey; needs the key and its PIN).
# Every recipient is on every secret, so the same file decrypts anywhere.
#
# key.json still lists darter's pre-rotation key alongside the current one, so
# take the key from the machine's own `~/.config/sops/age/keys.txt` rather than
# from whichever entry there comes first. A recipient the machine does not hold
# fails closed and quietly: sops-nix reports only "0 successful groups required,
# got 0", naming the file rather than the key it wanted.
keys:
  - &erik_darter age1jnndq4jl03mc7f5vtlyh24rr6e2pxe8y9nlk6yt9ztpmpahqhuwqmz639k
  - &erik_hades age1jz7tthllca32pw95jwfq8fhm4vy5j43p4akc3d54ae5evqvtpgmql8z53d
  - &yubikey_nano age1yubikey1qvagvtdammwnfa24wvzpwzrvtkjfz9vytxv475yzgssz3576yf9f7nxep7g
  - &yubikey_nfc age1yubikey1q2yk76pht3jv3ekcl3nmf94hls9d4v4zw6655rkm7d2sevnmp4s3zndun8g

creation_rules:
  - path_regex: home/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *erik_darter
          - *erik_hades
          - *yubikey_nano
          - *yubikey_nfc
