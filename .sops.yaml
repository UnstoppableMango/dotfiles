# Recipients for secrets kept in this repo. These are the same two age keys
# the nixos repo registers as the single clan user `erik` in
# sops/users/erik/key.json, one per machine, so a secret encrypted here
# decrypts on every machine that runs `dotfiles.sops.enable`.
#
# erasmussen (the MacBook) has no age key registered, so it cannot decrypt
# these. Add its public key to both this file and the nixos repo's key.json,
# then `sops updatekeys`, before enabling any sops-backed option there.
keys:
  - &erik_darter age16yu7pqrmwd3m7jrs5pdh2rd2z4lzskc2ywftqngtssgkd8vj54us875q6t
  - &erik_hades age1jnndq4jl03mc7f5vtlyh24rr6e2pxe8y9nlk6yt9ztpmpahqhuwqmz639k

creation_rules:
  - path_regex: users/erik/secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *erik_darter
          - *erik_hades
