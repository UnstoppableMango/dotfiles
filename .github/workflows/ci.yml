name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # It broke atm
    # runs-on: dotfiles-runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --all-systems

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#erik@darter \
          --no-out-link

      # The identity-free configuration. `nix flake check` does not evaluate
      # homeConfigurations, so without this the profile exports would only
      # break in whatever flake consumes them. The darwin half is the `darwin`
      # job below.
      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@x86_64-linux \
          --no-out-link

  # `generic@aarch64-darwin` is the only consumer the darwin branches in
  # `modules/` have had since the darwin host was removed, so it gets a real
  # build on a real mac rather than an evaluation on the linux runner.
  # `macos-latest` is Apple Silicon, which is the aarch64-darwin this builds.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@aarch64-darwin \
          --no-out-link
