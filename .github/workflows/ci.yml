name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --all-systems

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#erik@darter \
          --no-out-link

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@x86_64-linux \
          --no-out-link

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@aarch64-darwin \
          --no-out-link
