name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # It broke atm
    # runs-on: dotfiles-runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --all-systems

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#erik@darter \
          --no-out-link

      # The identity-free configuration. `nix flake check` does not evaluate
      # homeConfigurations, so without this the modules no host turns on would
      # only break in whatever flake consumes `homeModules.dotfiles`. The
      # darwin half is the `darwin` job below.
      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@x86_64-linux \
          --no-out-link

  # `generic@aarch64-darwin` is the only consumer the darwin branches in
  # `modules/` have had since the darwin host was removed, so it gets a real
  # build on a real mac rather than an evaluation on the linux runner.
  # `macos-latest` is Apple Silicon, which is the aarch64-darwin this builds.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@aarch64-darwin \
          --no-out-link

  # Builds `packages.container` on every run and publishes it from main only.
  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#container --no-link

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | nix run nixpkgs#skopeo -- login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          nix run .#container.copyToRegistry
          nix run .#container.copyTo -- \
            docker://ghcr.io/unstoppablemango/dotfiles:${GITHUB_SHA::7}
