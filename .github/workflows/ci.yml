name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Hercules CI builds Linux; the hosted jobs and the gate come from unmango/ci.
  nix:
    uses: unmango/ci/.github/workflows/nix-ci.yml@30ae545a17dc3cd88663c8d0aa92ae374b62779c
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  required:
    needs: [nix, darwin]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"

  check:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # The runner pod is capped at 8 CPU / 8Gi, and `max-jobs = auto`
          # sizes off the node rather than the cgroup. HTTP/2 is off because
          # substituting from this runner hit repeated HTTP/2 framing errors.
          extra_nix_config: |
            max-jobs = 2
            cores = 4
            http2 = false

      - run: nix flake check --all-systems

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#erik@darter \
          --no-out-link

      # `nix flake check` does not evaluate homeConfigurations.
      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@x86_64-linux \
          --no-out-link

  # The only build of the darwin branches in `modules/`. macos-latest is aarch64.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix run home-manager -- build \
          --flake ${{ github.workspace }}#generic@aarch64-darwin \
          --no-out-link

  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#container --no-link

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | nix run nixpkgs#skopeo -- login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          nix run .#container.copyToRegistry
          nix run .#container.copyTo -- \
            docker://ghcr.io/unstoppablemango/dotfiles:${GITHUB_SHA::7}
